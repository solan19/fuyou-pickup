name: Build signed release

# 蜉蝣·取件通（IdCode）release 构建：产出「自签名」release APK，并挂到 Release 上。
#
# ★★ v1.4.26：签名材料全部改从 **GitHub Secrets** 读取，仓库里不再出现任何密码。
#   旧版是从 `keystore-store` Release 下载密钥、并在脚本里写死 storepass / keypass；
#   仓库转公开后这些密码等于公开，密钥文件也可能被匿名下载。
#
#   需要配置的 Secrets（Settings → Secrets and variables → Actions）：
#     KEYSTORE_BASE64     签名 keystore 的 base64 文本（本机执行 base64 -w0 fuyou.keystore）
#     KEYSTORE_PASSWORD   keystore 的 storepass
#     KEY_ALIAS           密钥别名（本项目为 fuyou）
#     KEY_PASSWORD        密钥的 keypass
#
#   ⚠️ 历史提交里仍有明文密码。彻底消除需要**轮换密钥**，但轮换会让已安装版本
#      无法覆盖安装（只能卸载重装、数据清空）⇒ 是否轮换由作者决定，CI 不擅自处理。
#
# ★ 本工作流**不发布更新**：不生成/不改 update.json、不动 App 内分发状态。
#   分发仍由人工确认后在本地执行 `python tools/publish_update.py --confirm`
#   （见 README「更新分发」），保证「代码提交 ≠ 分发」。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空自动生成）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 安装编译所需 SDK 组件
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 导入签名材料（Secrets）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64。请在仓库 Secrets 里配置签名材料（见本文件头注释）；本工作流不再从 Release 下载密钥。"
            exit 1
          fi
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > .signing/fuyou.keystore
          echo "keystore 已导入：$(wc -c < .signing/fuyou.keystore) 字节"

      - name: 构建未签名 release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: 对齐并签名
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          if [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::缺少 KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD 之一。"
            exit 1
          fi
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "unsigned: $APK"
          "$BT/zipalign" -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks .signing/fuyou.keystore --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KS_PASS" --key-pass "env:KEY_PASS" \
            --out idcode-release.apk aligned.apk
          "$BT/apksigner" verify --print-certs idcode-release.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: idcode-release-apk
          path: idcode-release.apk

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          # 版本号从 build.gradle.kts 读，不再手写在标题/说明里（v1.4.26）
          CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | head -1 | grep -oE '[0-9]+$')
          NAME=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)"/\1/')
          echo "version: $CODE / $NAME"
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="$REF_NAME"; fi
          case "$TAG" in refs/*) TAG="" ;; esac
          if [ -z "$TAG" ]; then TAG="v$NAME-$(date +%Y%m%d%H%M)"; fi
          echo "release tag: $TAG"
          gh release create "$TAG" idcode-release.apk \
            --title "$TAG · 蜉蝣·取件通 $NAME" \
            --notes "自签名 release 包（versionCode $CODE / versionName $NAME）。" \
            || gh release upload "$TAG" idcode-release.apk --clobber
          echo "release done: $TAG"
