name: Build signed release

# 蜉蝣·取件通（IdCode）release 构建：产出「自签名」release APK，并挂到 Release 上。
# 签名密钥首次由 CI 生成并保存到 keystore-store 这个 Release（请下载保管），
# 之后每次构建自动复用，保证后续版本签名一致、可覆盖升级。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空自动生成）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: 安装编译所需 SDK 组件
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: 取回或生成签名密钥
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p .signing && cd .signing
          if gh release download keystore-store -p fuyou.keystore 2>/dev/null; then
            echo "复用已有 keystore"
          else
            echo "生成新的 keystore"
            keytool -genkeypair -v -keystore fuyou.keystore -alias fuyou \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass fuyou123456 -keypass fuyou123456 \
              -dname "CN=Fuyou IdCode, OU=Personal, O=Fuyou, L=Beijing, ST=Beijing, C=CN"
            gh release create keystore-store fuyou.keystore \
              --title "签名密钥（请下载保管）" \
              --notes "本仓库后续版本使用的签名密钥，请下载保存。丢失后无法对已安装的版本做覆盖升级。" \
              || gh release upload keystore-store fuyou.keystore --clobber
          fi
          cd ..

      - name: 构建未签名 release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: 对齐并签名
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "unsigned: $APK"
          "$BT/zipalign" -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks .signing/fuyou.keystore \
            --ks-pass pass:fuyou123456 --key-pass pass:fuyou123456 \
            --out idcode-release.apk aligned.apk
          "$BT/apksigner" verify --print-certs idcode-release.apk

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: idcode-release-apk
          path: idcode-release.apk

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="$REF_NAME"; fi
          case "$TAG" in refs/*) TAG="" ;; esac
          if [ -z "$TAG" ]; then TAG="v1.2.5-$(date +%Y%m%d%H%M)"; fi
          echo "release tag: $TAG"
          gh release create "$TAG" idcode-release.apk \
            --title "$TAG · 蜉蝣·取件通 1.2.5" \
            --notes "自签名 release 包（versionCode 691 / versionName 1.2.5）。" \
            || gh release upload "$TAG" idcode-release.apk --clobber
          echo "release done: $TAG"
